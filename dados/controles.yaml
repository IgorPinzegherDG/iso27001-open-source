# Fonte de verdade deste repositório.
# Os arquivos em controles/ e ferramentas/ são gerados por
# scripts/gerar.py a partir deste arquivo. Edite aqui, não lá.

versao_norma: ISO/IEC 27001:2022 (Anexo A) / ISO/IEC 27002:2022
